<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeadRace</title>
  <style>
    :root { color-scheme: dark; --text: #f8fbff; --muted: #dbeafe; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Avenir Next", "Segoe UI", sans-serif; background: #061018; color: var(--text); }
    .juego { position: relative; height: 100vh; min-height: 640px; background: #08304a; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; inset: 0; pointer-events: none; }
    .medidores, .dia, .mapa, .camara, .controles, #aviso { pointer-events: auto; }
    .medidores { position: absolute; top: 18px; left: 18px; display: flex; gap: 12px; }
    .vidrio {
      display: flex; align-items: center; gap: 10px;
      min-width: 148px; padding: 12px 16px;
      border-radius: 22px;
      background: rgba(8, 22, 42, 0.46);
      border: 1px solid rgba(186, 230, 253, 0.45);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }
    .vidrio span { display: block; font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }
    .vidrio strong { font-size: 30px; line-height: 1; }
    .vidrio small { margin-left: 4px; color: #bae6fd; }
    .gauge { width: 54px; height: 54px; }
    .dia {
      position: absolute; top: 22px; right: 22px;
      padding: 10px 18px; border-radius: 999px;
      background: rgba(8, 22, 42, 0.5);
      border: 1px solid rgba(254, 240, 138, 0.7);
      font-weight: 700;
    }
    .mapa {
      position: absolute; top: 84px; right: 18px; width: 118px; height: 360px;
      border-radius: 22px; padding: 14px 12px;
      background: rgba(8, 22, 42, 0.42);
      border: 1px solid rgba(186, 230, 253, 0.4);
      backdrop-filter: blur(8px);
    }
    .mapa p { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.16em; }
    .trazo { position: absolute; left: 54px; top: 42px; bottom: 28px; width: 8px; border-radius: 8px; background: rgba(255,255,255,0.28); }
    #marcas { position: absolute; inset: 36px 16px 24px; }
    #marcas i { position: absolute; width: 8px; height: 8px; border-radius: 2px; }
    #marcas i.cono { background: #fb923c; }
    #marcas i.caja { background: #fbbf24; }
    #marcas i.barrera { background: #fb7185; }
    #jugador {
      position: absolute; left: 46px; bottom: 16px; width: 0; height: 0;
      border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 14px solid #86efac;
    }
    .camara {
      position: absolute; left: 18px; bottom: 92px; width: 250px;
      padding: 10px; border-radius: 20px;
      background: rgba(8, 22, 42, 0.5);
      border: 1px solid rgba(186, 230, 253, 0.45);
      backdrop-filter: blur(8px);
    }
    .camara header { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 0.12em; margin-bottom: 6px; }
    .live { color: #86efac; }
    .camara img { width: 100%; height: 112px; object-fit: cover; border-radius: 12px; background: #0b1220; }
    #aviso { position: absolute; top: 108px; left: 50%; transform: translateX(-50%); margin: 0; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #fde68a; }
    .controles { position: absolute; left: 18px; bottom: 18px; display: flex; gap: 10px; }
    button {
      border-radius: 999px; padding: 12px 18px; font: inherit; cursor: pointer;
      background: rgba(8, 22, 42, 0.72); color: white;
      border: 1px solid rgba(186, 230, 253, 0.5);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    button:hover { transform: translateY(-1px); border-color: #7dd3fc; }
    #terminar { background: #86efac; color: #052e16; border: 0; font-weight: 700; }
    button:disabled { opacity: 0.45; }
    #impacto { position: absolute; inset: 0; background: rgba(248, 113, 113, 0.28); opacity: 0; pointer-events: none; }
    #impacto.activo { opacity: 1; }
    .tiempos { max-width: 1100px; margin: 0 auto; padding: 28px 20px 48px; }
    h2 { font-size: 0.78rem; letter-spacing: 0.16em; color: #93a4b5; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    th { color: #93a4b5; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
    #vacio { color: #93a4b5; }
  </style>
</head>
<body>
  <div class="juego">
    <canvas id="pista"></canvas>
    <div class="hud">
      <div class="medidores">
        <div class="vidrio">
          <svg class="gauge" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6"></circle>
            <circle id="arco" cx="30" cy="30" r="20" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" transform="rotate(-90 30 30)"></circle>
          </svg>
          <div>
            <span>VELOCIDAD</span>
            <strong id="velocidad">—</strong><small>km/h</small>
          </div>
        </div>
        <div class="vidrio">
          <div>
            <span>TRAMO</span>
            <strong id="tiempo">—</strong>
          </div>
        </div>
        <div class="vidrio">
          <div>
            <span>CHOQUES</span>
            <strong id="colisiones">0</strong>
          </div>
        </div>
      </div>
      <div class="dia" id="etiqueta-dia">Día</div>
      <div class="mapa">
        <p>MAPA</p>
        <div class="trazo"></div>
        <div id="marcas"></div>
        <div id="jugador"></div>
      </div>
      <div class="camara">
        <header><span>CÁMARA</span><span class="live" id="captura">LIVE</span></header>
        <img id="vista" alt="Cámara">
      </div>
      <p id="aviso" role="status"></p>
      <div class="controles">
        <button id="obstaculo" type="button">Simular obstáculo</button>
        <button id="terminar" type="button">Terminar sesión</button>
      </div>
      <div id="impacto"></div>
    </div>
  </div>
  <section class="tiempos">
    <h2>Mejores tiempos</h2>
    <p id="vacio">Sin vueltas todavía</p>
    <table id="tabla" hidden>
      <thead>
        <tr><th>Tiempo</th><th>Colisiones</th><th>Alertas</th><th>Velocidad</th><th>Fecha</th></tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>
  </section>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="/juego/main.js?v=5"></script>
</body>
</html>
